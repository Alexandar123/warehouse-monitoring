name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Includes the end-to-end tests: the runner has Docker, so Testcontainers starts Kafka
      - run: ./mvnw -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [warehouse, central]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t image .
      # Deploy step: publish the image to GitHub Container Registry, only from main
      - if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/warehouse-monitoring-${{ matrix.service }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag image "$IMAGE:${{ github.sha }}"
          docker tag image "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
