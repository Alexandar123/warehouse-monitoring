services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL for containers (service name), EXTERNAL for tools and services running on the host
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server=kafka:29092
      - --create
      - --if-not-exists
      - --topic=measurements
      - --partitions=3
      - --replication-factor=1

  central:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: central
    image: warehouse-monitoring/central
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TEMPERATURE_THRESHOLD: "35"
      HUMIDITY_THRESHOLD: "50"

  warehouse:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: warehouse
    image: warehouse-monitoring/warehouse
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      WAREHOUSE_ID: w1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      # without /udp Docker publishes TCP and every datagram disappears
      - "3344:3344/udp"
      - "3355:3355/udp"

  # A second warehouse on other host ports shows multi-warehouse support.
  warehouse-2:
    image: warehouse-monitoring/warehouse
    depends_on:
      warehouse:
        condition: service_started
    environment:
      WAREHOUSE_ID: w2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "4344:3344/udp"
      - "4355:3355/udp"
